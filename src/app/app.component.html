<div>
  <!-- Header -->
  <mat-toolbar>
    <img src="assets/3a99c6cea3291b048216bbc4da6e86fb16837693.svg" alt="Cymbal logo" class="logo">
  </mat-toolbar>

  <div *ngIf="error" class="error-message">{{error}}</div>

  <!-- Create a card for each quote  -->
  <div class="container">
    <div class="list-item" *ngFor="let quote of quotes | async">
      <div class="content">
        <div class="leading-element">
          <img alt="icon" class="icon" src="assets/c585a3b8e96272686e21ed2fd0cb5a4d3986da40.svg" />
        </div>
        <div class="text">
          <div class="title">{{ quote.quote }}</div>
          <div class="description">{{ quote.author }}</div>
        </div>
      </div>
      <div class="divider"></div>
    </div>
  </div>

  <!-- Get a random quote -->
  <div *ngIf="!showRandomQuote" class="random-quote-button">
    
    <mat-form-field appearance="outline">
      <mat-label>Prompt</mat-label>
      <input matInput placeholder="Enter a seed word of phrase" [(ngModel)]="randomPrompt">
    </mat-form-field>
    
    <button mat-raised-button color="primary" 
        (click)="getRandomQuote()">
      Get Random Quote
    </button>
  </div>

  <!-- Get all quotes -->
  <button mat-raised-button color="primary" *ngIf="showRandomQuote" class="random-quote-button"
      (click)="getAllQuotes()">
    Get All Quotes
  </button>
</div>
